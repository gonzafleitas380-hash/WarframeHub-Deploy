server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: cualquier ruta que no sea un archivo real cae en
    # index.html, para que /catalogo, /perfil/:username, etc. funcionen
    # al refrescar la página o entrar directo por URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend real hace fetch a rutas relativas ("/api/...",
    # "/uploads/..."), igual que el proxy de Vite en desarrollo.
    # "backend" es el nombre del servicio en docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
